<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>제타 스튜디오</title>
<link rel="manifest" href="studio.webmanifest">
<link rel="apple-touch-icon" href="studio-192.png">
<link rel="icon" href="studio-192.png">
<meta name="theme-color" content="#0e0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Black+Han+Sans&family=Jua&family=Do+Hyeon&family=Gaegu:wght@700&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e0d12; --bg2:#17151d; --card:#1e1b26; --card2:#262230; --line:#332e3e;
  --tx:#f1edf7; --tx2:#a9a1b8; --tx3:#6f6880;
  --ac:#ff5d8f; --ac2:#8b7bff; --ok:#3ddc97; --warn:#ffb547; --bad:#ff5c5c;
  --r:16px; --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:"IBM Plex Sans KR",system-ui,sans-serif;font-size:15px;line-height:1.5}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* ===== HOME ===== */
#home{min-height:100vh;padding:calc(var(--safe-t) + 22px) 18px calc(var(--safe-b) + 30px);
  background:radial-gradient(120% 60% at 0% 0%,#3a1530 0%,transparent 60%),radial-gradient(100% 60% at 100% 10%,#1d1a4a 0%,transparent 55%),var(--bg)}
.brand{font-family:"Black Han Sans",sans-serif;font-size:34px;letter-spacing:.5px;line-height:1.1}
.brand span{color:var(--ac)}
.sub{color:var(--tx2);font-size:13px;margin-top:4px}
.curwork{margin:18px 0 22px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:14px 16px;display:flex;align-items:center;gap:12px;backdrop-filter:blur(8px)}
.curwork .lbl{font-size:12px;color:var(--tx2)}
.curwork .nm{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.curwork .grow{flex:1;min-width:0}
.sect{font-size:12px;font-weight:600;color:var(--tx3);letter-spacing:1px;margin:18px 4px 10px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 10px}
@media(min-width:560px){.grid{grid-template-columns:repeat(6,1fr)}}
.app{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:7px}
.ico{width:62px;height:62px;border-radius:17px;display:grid;place-items:center;font-size:30px;box-shadow:0 6px 18px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.25);transition:transform .12s}
.ico img{width:100%;height:100%;border-radius:17px;object-fit:cover}
.app:active .ico{transform:scale(.9)}
.app .an{font-size:12px;color:var(--tx);text-align:center;line-height:1.25}

/* ===== APP VIEW ===== */
#view{min-height:100vh;background:var(--bg)}
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:calc(var(--safe-t) + 8px) 10px 8px;background:rgba(14,13,18,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar .back{background:none;border:0;font-size:22px;padding:4px 10px;color:var(--ac)}
.bar .ttl{font-weight:700;font-size:17px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:5px 11px;font-size:12px;max-width:44vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.body{padding:14px 14px calc(var(--safe-b) + 90px);max-width:820px;margin:0 auto}
.frame{position:fixed;left:0;right:0;bottom:0;border:0;width:100%;background:#fff}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:15px;display:flex;align-items:center;gap:6px}
.muted{color:var(--tx2);font-size:13px}
.tiny{color:var(--tx3);font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>.grow{flex:1;min-width:120px}
label.f{display:block;font-size:12px;color:var(--tx2);margin:10px 0 4px}
input[type=text],input[type=number],input[type=password],textarea,select{font-size:16px;width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:10px 12px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--ac2)}
textarea{resize:vertical;min-height:84px}
.btn{background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:8px 12px;font-size:13px;white-space:nowrap}
.btn.p{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.btn.v{background:var(--ac2);border-color:var(--ac2);color:#fff;font-weight:600}
.btn.d{color:var(--bad)}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:9px}
.btn:active{opacity:.7}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.cnt{font-size:12px;color:var(--tx3);text-align:right;margin-top:3px}
.cnt.over{color:var(--bad);font-weight:600}
.pill{display:inline-block;background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:5px 10px;font-size:12px;margin:3px 3px 0 0}
.pill.on{background:var(--ac2);border-color:var(--ac2);color:#fff}
.out{white-space:pre-wrap;background:#0a090d;border:1px dashed var(--line);border-radius:11px;padding:12px;font-size:13.5px;min-height:40px;word-break:break-word}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.tabs button{flex:none}
.item{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:8px}
.ix{display:flex;gap:6px;align-items:center}
.ix .n{font-size:12px;color:var(--tx3);min-width:22px}
.warnbox{background:rgba(255,181,71,.1);border:1px solid rgba(255,181,71,.35);color:var(--warn);border-radius:10px;padding:8px 10px;font-size:12.5px;margin-top:8px}
.okc{color:var(--ok)}
.check{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line)}
.check input{width:20px;height:20px;accent-color:var(--ac)}
.prog{height:6px;background:var(--bg2);border-radius:9px;overflow:hidden;margin-top:6px}
.prog>i{display:block;height:100%;background:linear-gradient(90deg,var(--ac2),var(--ac))}
.big{font-family:"Black Han Sans";font-size:28px}
.stat{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stat div{background:var(--bg2);border-radius:11px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--tx2)}

/* sheet + toast */
#sheetBg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--bg2);border-radius:22px 22px 0 0;padding:16px 16px calc(var(--safe-b) + 18px);max-height:82vh;overflow:auto;border-top:1px solid var(--line);max-width:820px;margin:0 auto}
#sheet h3{margin:4px 0 12px}
#toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 26px);transform:translateX(-50%);background:#fff;color:#111;padding:9px 16px;border-radius:18px;font-size:13.5px;font-weight:600;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;width:max-content;max-width:88vw;text-align:center;line-height:1.4;word-break:keep-all;overflow-wrap:anywhere}
#toast.on{opacity:1}
.wk{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;background:var(--card);border:1px solid var(--line);margin-bottom:8px}
.wk.sel{border-color:var(--ac)}
.wk .grow{flex:1;min-width:0}
.wk .t{font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ac);flex:none}
</style>
</head>
<body>

<div id="home"></div>
<div id="view" class="hidden"></div>
<div id="sheetBg" class="hidden"></div>
<div id="sheet" class="hidden"></div>
<div id="toast"></div>

<script>
"use strict";
/* ================= 공용 ================= */
const $ = s => document.querySelector(s);
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  if (attrs) for (const k in attrs){
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "style") el.style.cssText = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "value") el.value = v;
    else if (k === "checked") el.checked = v;
    else if (k === "html") el.innerHTML = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat(Infinity)){
    if (c == null || c === false) continue;
    el.appendChild(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return el;
}
const uid = () => Math.random().toString(36).slice(2, 9);
let toastT;
function toast(m){ const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove("on"), Math.min(4500, 1400 + String(m).length * 45)); }
function copy(text, msg){
  if (!String(text || "").trim()){ toast("복사할 내용이 없어요"); return; }
  const fallback = () => openSheet("복사하기", [h("p",{class:"muted"},"자동 복사가 막혀 있어요. 아래를 길게 눌러 복사하세요."), (()=>{const ta=h("textarea",{style:"min-height:240px",value:text}); setTimeout(()=>{ta.focus();ta.select();},50); return ta;})()]);
  try { navigator.clipboard.writeText(text).then(()=>toast(msg || "복사했어요"), fallback); } catch(e){ fallback(); }
}
const len = s => [...(s||"")].length;
/* 파일 저장 (artifact downloads 기능) */
let _dl = null;
function getDL(){
  if (_dl) return _dl;
  if (!(window.claude && window.claude.use)) return Promise.resolve(null);
  _dl = (async () => { try { return await window.claude.use("downloads"); } catch(e){ return null; } })();
  return _dl;
}
const MIME = { gif:"image/gif", png:"image/png", jpg:"image/jpeg", mp4:"video/mp4", webm:"video/webm", json:"application/json", txt:"text/plain" };
async function plainDownload(name, data){
  const ext = (name.split(".").pop() || "").toLowerCase();
  const blob = data instanceof Blob ? data : new Blob([data], { type: MIME[ext] || "application/octet-stream" });
  // 폰: 공유 창(사진에 저장 가능) → 안 되면 일반 다운로드
  try {
    const file = new File([blob], name, { type: blob.type || MIME[ext] || "application/octet-stream" });
    if (/gif|png|jpe?g|mp4|webm/.test(ext) && navigator.canShare && navigator.canShare({ files:[file] }) && /Android|iPhone|iPad/i.test(navigator.userAgent)){
      await navigator.share({ files:[file], title:name }); return true;
    }
  } catch(e){ if (e && e.name === "AbortError") return false; }
  try {
    const url = URL.createObjectURL(blob), a = document.createElement("a");
    a.href = url; a.download = name; a.rel = "noopener"; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 30000); return true;
  } catch(e){ return false; }
}
async function saveFile(name, data, fallbackMsg){
  const dl = await getDL();
  if (!dl){
    if (typeof inClaudeApp === "function" && inClaudeApp()){ toast(fallbackMsg || "이 화면에서는 파일 저장이 안 돼요"); return false; }
    const ok = await plainDownload(name, data); if (ok) toast("저장했어요"); else toast(fallbackMsg || "저장하지 못했어요"); return ok;
  }
  try { await dl.save({ filename: name, data }); toast("저장했어요"); return true; }
  catch(e){
    const c = e && e.code;
    toast(c === "declined" ? "저장을 취소했어요" : c === "rate_limited" ? "잠시 후 다시 눌러 주세요" : c === "too_large" ? "파일이 너무 커요. 크기를 줄여 주세요" : "저장 실패 (" + (c || e) + ")");
    return false;
  }
}
const lenNoSp = s => [...(s||"").replace(/\s/g,"")].length;

/* ================= 저장 ================= */
const KEY = "zeta-studio-v1";
function blankWork(name, extra){
  return Object.assign({
    id: uid(), name, created: Date.now(),
    fields: {}, limits: {},
    lore: [], status: { title: "상태창", style: "box", items: [] },
    eps: [{ id: uid(), title: "1화", cuts: [] }],
    tipsy: {}, memo: "", charTags: ""
  }, extra || {});
}
function seed(){
  const a = blankWork("최전선 기사단장, 성녀로 전직하다", {
    fields: {
      name: "최전선 기사단장",
      intro: "제국 최전선의 흑철기사단장. 치명상을 입고 죽어가던 순간, 하늘에서 빛이 내려와… 성녀가 되어버렸다?!",
      situation: "기사단장이 전장에서 죽어가다가 빛이 내려와 TS되어 성녀가 된다. 분위기는 코믹하게."
    },
    charTags: "1girl, blonde hair, long hair, white nun habit, holy aura"
  });
  const b = blankWork("사냥감이 된 용병", { tipsyNote: "Tipsy에는 이미지 없이 설명만 옮기기" });
  const c = blankWork("신님, 전산 오류입니다", {
    fields: {
      name: "신님, 전산 오류입니다",
      intro: "여신의 전산 실수로 남자가 여자가 되어버렸다. 일상·판타지·TS 코미디.",
      situation: "여신이 손가락을 튕기는 대신 반죽을 가져와 빚어서 성별을 '고치는' 장면부터 시작."
    },
    charTags: "1girl, blonde hair, flustered, sweat drop"
  });
  const d = blankWork("ts앱");
  return { cur: a.id, works: { [a.id]: a, [b.id]: b, [c.id]: c, [d.id]: d }, order: [a.id, b.id, c.id, d.id],
    pixai: {
      model: "Tsubaki.3 Flash", ratio: "3:5", batch: 4, xl: true,
      loras: [
        { name: "Juwon style 2nd", w: 0.7, on: true },
        { name: "Y3LLOW style", w: 0.7, on: true },
        { name: "Sugar Style", w: 0.7, on: true },
        { name: "My_style", w: 0.7, on: false },
        { name: "hakusin v1", w: 0.7, on: false }
      ],
      quality: "masterpiece, best quality, webtoon style",
      negative: "lowres, bad anatomy, bad hands, extra fingers, text, watermark, signature, blurry"
    },
    memo: "", recent: []
  };
}
let S;
try { S = JSON.parse(localStorage.getItem(KEY)); } catch(e){ S = null; }
if (!S || !S.works) S = seed();
let saveT, saveWarned = false;
function saveNow(){
  clearTimeout(saveT); saveT = null;
  try {
    for (const id in S.works){ const w = S.works[id]; if (w.chat && w.chat.length > 400) w.chat = w.chat.slice(-400); }
    localStorage.setItem(KEY, JSON.stringify(S)); saveWarned = false;
  } catch(e){
    if (!saveWarned){ saveWarned = true; try { toast("⚠ 저장 공간이 꽉 찼어요. 💾 백업 후 오래된 채팅·작품을 정리해 주세요"); } catch(_){} }
  }
}
function save(){ clearTimeout(saveT); saveT = setTimeout(saveNow, 300); }
window.addEventListener("pagehide", () => { if (saveT) saveNow(); });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden" && saveT) saveNow(); });
const W = () => S.works[S.cur] || S.works[S.order[0]];
/* 저장 데이터 점검·복구: 예전 버전·깨진 백업이 들어와도 화면이 멈추지 않게 */
const str = v => v == null ? "" : String(v);
function normWork(w, isRef){
  if (!w || typeof w !== "object" || Array.isArray(w)) return null;
  w.id = str(w.id) || uid(); w.name = str(w.name).trim() || "이름 없는 작품";
  for (const k of ["fields","limits","tipsy"]) if (!w[k] || typeof w[k] !== "object" || Array.isArray(w[k])) w[k] = {};
  for (const k in w.fields) w.fields[k] = str(w.fields[k]);
  w.lore = (Array.isArray(w.lore) ? w.lore : []).filter(x => x && typeof x === "object").map(x => ({ id: str(x.id) || uid(), k: str(x.k), v: str(x.v), on: x.on !== false }));
  if (!w.status || typeof w.status !== "object") w.status = {};
  w.status.title = typeof w.status.title === "string" ? w.status.title : "상태창";
  if (!["box","list","line","code"].includes(w.status.style)) w.status.style = "box";
  w.status.items = (Array.isArray(w.status.items) ? w.status.items : []).filter(x => x && typeof x === "object").map(x => ({ l: str(x.l), e: str(x.e) }));
  w.eps = (Array.isArray(w.eps) ? w.eps : []).filter(e => e && typeof e === "object").map(e => ({ id: str(e.id) || uid(), title: str(e.title) || "화",
    cuts: (Array.isArray(e.cuts) ? e.cuts : []).filter(c => c && typeof c === "object").map(c => ({ id: str(c.id) || uid(), shot: str(c.shot) || "바스트샷", face: str(c.face), scene: str(c.scene),
      bubbles: (Array.isArray(c.bubbles) ? c.bubbles.map(str) : [""]).slice(0, 3), note: str(c.note), tags: str(c.tags) })) }));
  if (!w.eps.length) w.eps = [{ id: uid(), title: "1화", cuts: [] }];
  w.memo = str(w.memo); w.charTags = str(w.charTags);
  if (w.chat != null){
    w.chat = (Array.isArray(w.chat) ? w.chat : []).filter(m => m && typeof m === "object").map(m => {
      const o = { r: m.r === "user" ? "user" : "assistant", t: str(m.t) };
      if (Array.isArray(m.alts) && m.alts.length > 1){ o.alts = m.alts.map(str); o.ai = Math.max(0, Math.min(o.alts.length - 1, +m.ai || 0)); }
      return o; });
    w.chatMem = str(w.chatMem); w.chatMemUpto = Math.max(0, Math.min(w.chat.length, +w.chatMemUpto || 0));
  }
  if (isRef){ w.ref = true; w.author = str(w.author); if (!w.pop || typeof w.pop !== "object") w.pop = {}; w.pop = { chats: Math.max(0, +w.pop.chats || 0), likes: Math.max(0, +w.pop.likes || 0) }; }
  return w;
}
function normalizeState(){
  if (!S || typeof S !== "object" || Array.isArray(S)) S = seed();
  if (!S.works || typeof S.works !== "object" || Array.isArray(S.works)) S.works = {};
  for (const id of Object.keys(S.works)){ const w = normWork(S.works[id]); if (!w){ delete S.works[id]; continue; } w.id = id; }
  const seen = new Set();
  S.order = (Array.isArray(S.order) ? S.order : []).map(str).filter(id => S.works[id] && !seen.has(id) && seen.add(id));
  for (const id of Object.keys(S.works)) if (!seen.has(id)) S.order.push(id);
  if (!S.order.length){ const w = blankWork("새 작품"); S.works[w.id] = w; S.order = [w.id]; }
  if (!S.works[S.cur]) S.cur = S.order[0];
  const base = seed().pixai;
  if (!S.pixai || typeof S.pixai !== "object") S.pixai = base;
  for (const k in base) if (S.pixai[k] == null) S.pixai[k] = base[k];
  S.pixai.loras = (Array.isArray(S.pixai.loras) ? S.pixai.loras : []).filter(l => l && typeof l === "object").map(l => ({ name: str(l.name), w: isFinite(+l.w) ? +l.w : 0.7, on: !!l.on }));
  for (const k of ["model","ratio","quality","negative"]) S.pixai[k] = str(S.pixai[k]);
  S.pixai.batch = [1,2,4].includes(+S.pixai.batch) ? +S.pixai.batch : 4;
  S.refs = (Array.isArray(S.refs) ? S.refs : []).map(r => normWork(r, true)).filter(Boolean);
  S.recent = (Array.isArray(S.recent) ? S.recent : []).map(str);
  S.memo = str(S.memo);
}

/* ================= 시트 ================= */
let sheetCloseHook = null;
function runSheetHook(){ const f = sheetCloseHook; sheetCloseHook = null; if (f) try { f(); } catch(e){} }
function openSheet(title, kids){
  runSheetHook();
  const sh = $("#sheet"); sh.innerHTML = ""; sh.scrollTop = 0;
  sh.append(h("h3", null, title), ...kids, h("div",{class:"btns",style:"margin-top:14px"}, h("button",{class:"btn",style:"width:100%",onclick:closeSheet},"닫기")));
  sh.classList.remove("hidden"); $("#sheetBg").classList.remove("hidden");
}
function closeSheet(){ runSheetHook(); $("#sheet").classList.add("hidden"); $("#sheetBg").classList.add("hidden"); }
$("#sheetBg").onclick = closeSheet;
function confirmSheet(msg, okLabel, fn){
  openSheet(msg, [h("button",{class:"btn p",style:"width:100%",onclick:()=>{closeSheet();fn();}}, okLabel)]);
}
function askText(title, init, fn, allowEmpty){
  const inp = h("input",{type:"text",value:init||""});
  const ok = ()=>{const v=inp.value.trim(); if(!v && !allowEmpty) return toast("내용을 입력해 주세요"); closeSheet(); fn(v);};
  inp.addEventListener("keydown", e => { if (e.key === "Enter" && !e.isComposing){ e.preventDefault(); ok(); } });
  openSheet(title, [inp, h("div",{class:"btns"}, h("button",{class:"btn p",style:"width:100%",onclick:ok}, "확인"))]);
  setTimeout(()=>inp.focus(),80);
}
function askLong(title, init, fn){
  const ta = h("textarea",{style:"min-height:46vh",value:init||""});
  openSheet(title, [ta, h("div",{class:"btns"}, h("button",{class:"btn p",style:"width:100%",onclick:()=>{ closeSheet(); fn(ta.value); }}, "저장"))]);
}
function pickWork(after){
  openSheet("작품 선택", S.order.map(id => {
    const w = S.works[id];
    return h("div",{class:"wk"+(id===S.cur?" sel":""),onclick:()=>{S.cur=id;save();closeSheet();after&&after();}},
      h("div",{class:"dot",style:id===S.cur?"":"background:var(--line)"}), h("div",{class:"grow"}, h("div",{class:"t"},w.name)));
  }).concat([h("button",{class:"btn",style:"width:100%;margin-top:6px",onclick:()=>{closeSheet();go("works");}},"＋ 작품 관리")]));
}

function go(id){ if (location.hash === "#"+id) route(); else location.hash = id; }
window.addEventListener("hashchange", route);
function route(){
  const id = location.hash.slice(1);
  closeSheet();
  if (!APP[id]){ renderHome(); $("#home").classList.remove("hidden"); $("#view").classList.add("hidden"); window.scrollTo(0,0); return; }
  S.recent = [id, ...(S.recent||[]).filter(x=>x!==id)].slice(0,4); save();
  $("#home").classList.add("hidden"); $("#view").classList.remove("hidden");
  renderApp(id); window.scrollTo(0,0);
}
function renderHome(){
  const home = $("#home"); home.innerHTML = "";

function appBtn(id){ const a = APP[id]; return h("button",{class:"app",onclick:()=>go(id)}, icon(a), h("div",{class:"an"},a.name)); }

function renderApp(id){
  const v = $("#view"); v.innerHTML = "";

    h("button",{class:"back",onclick:()=>{ location.hash = ""; }},"‹"),
    icon(a, 28), h("div",{class:"ttl"}, a.name),
    ["sedotoon","backup","idea","ai"].includes(id) ? null : chip);
  v.append(bar);
  const body = h("div",{class:"body"});
  v.append(body);
  (VIEWS[id]||(()=>{}))(body, v, bar);

/* ===== 작은 위젯 ===== */
function counted(get, set, opts){
  opts = opts || {};
  const ta = h(opts.input ? "input" : "textarea", { type: opts.input ? "text" : null, value: get() || "", placeholder: opts.ph || "", style: opts.style || "" });
  const c = h("div",{class:"cnt"});
  const upd = () => {
    const n = len(ta.value), lim = opts.limit ? opts.limit() : 0;
    c.textContent = lim ? `${n} / ${lim}자` : `${n}자 (공백 제외 ${lenNoSp(ta.value)})`;
    c.classList.toggle("over", !!lim && n > lim);
  };
  ta.addEventListener("input", () => { set(ta.value); save(); upd(); });
  upd(); ta._upd = upd;
  return [ta, c];
}

function cleanText(s){
  return s.replace(/[ \t]+$/gm,"").replace(/\n{3,}/g,"\n\n").replace(/[“”]/g,"\"").replace(/[‘’]/g,"'").replace(/ {2,}/g," ").trim();
}
function toVars(s, w){
  const nm = (w.fields.name||"").trim();
  let r = s.replace(/(유저|당신|너)(?=[은는이가을를의에께도와과])/g,"{{user}}");
  if (nm) r = r.split(nm).join("{{char}}");
  return r;
}

VIEWS.dialog = (body) => {
  const w = W();

  const conv = () => {
    const nm = P.useVar ? "{{char}}" : ((w.fields.name||"").trim() || "{{char}}");
    const lines = ta.value.split("\n");
    const res = lines.map(raw => {
      let s = raw.trim(); if (!s) return "";
      let kind = "n";
      const mix = s.match(/^["“]([^"”]+)["”]\s*(.+)$/);
      if (mix){
        const q = mix[1].trim(), rest = mix[2].replace(/^\*|\*$/g,"").trim();
        if (P.mode === "zeta") return `"${q}" *${rest}*`;
        if (P.mode === "script") return `${nm}: "${q}" (${rest})`;
        return `"${q}" ${rest}`;
      }
      if (/^[-–—]\s*/.test(s)){ s = s.replace(/^[-–—]\s*/,""); kind = "d"; }
      else if (/^["“「『]/.test(s)){ s = s.replace(/^["“「『]|["”」』]$/g,""); kind = "d"; }
      else if (/^\(.*\)$/.test(s)){ s = s.slice(1,-1); kind = "t"; }
      else s = s.replace(/^\*|\*$/g,"");
      if (P.mode === "zeta"){
        if (kind==="d") return `"${s}"`;
        if (kind==="t") return `*(${s})*`;
        return `*${s}*`;
      }
      if (P.mode === "script"){
        if (kind==="d") return `${nm}: "${s}"`;
        if (kind==="t") return `${nm}: (${s})`;
        return `(${s})`;
      }
      if (kind==="d") return `"${s}"`; if (kind==="t") return `'${s}'`; return s;   // novel
    });
    out.textContent = res.join("\n").replace(/\n{3,}/g,"\n\n");

  };

  body.append(
    h("div",{class:"card"}, h("h3",null,"원문"), ta, h("label",{class:"f"},"변환 방식"), modes,
      h("label",{class:"check",style:"border:0"}, h("input",{type:"checkbox",checked:P.useVar,onchange:e=>{P.useVar=e.target.checked;conv();}}), "대본식 이름을 {{char}}로")),

      h("button",{class:"btn",onclick:()=>{ if(!out.textContent.trim()) return toast("변환된 내용이 없어요"); w.fields.example=((w.fields.example||"").trim()+"\n\n"+out.textContent).trim();save();toast("예시 대화에 추가했어요");}},"➕ 예시 대화에 추가")))

      `#${i+1} [${c.shot||"구도 미정"}]${c.face?" · 표정: "+c.face:""}\n장면: ${c.scene||"-"}\n`+
      (c.bubbles.filter(Boolean).length ? c.bubbles.filter(Boolean).map(b=>`  💬 ${b}`).join("\n")+"\n" : "")+
      (c.note?`메모: ${c.note}\n`:"")).join("\n");
  }
  function draw(){
    const e = w.eps[ei]; list.innerHTML = "";
    list.append(h("div",{class:"card"},
      h("div",{class:"row"}, h("input",{type:"text",class:"grow",value:e.title,oninput:ev=>{e.title=ev.target.value;save();},onchange:drawTabs}),
        h("button",{class:"btn sm d",onclick:()=>{ if(w.eps.length<2) return toast("마지막 화는 못 지워요"); confirmSheet("'"+e.title+"' 삭제?","삭제",()=>{w.eps.splice(ei,1);ei=0;save();drawTabs();draw();}); }},"화 삭제")),
      h("div",{class:"tiny",style:"margin-top:6px"},`컷 ${e.cuts.length}개 · 말풍선 ${e.cuts.reduce((s,c)=>s+c.bubbles.filter(Boolean).length,0)}개 · 컷당 말풍선 최대 3개, 효과음 최소화`),
      h("div",{class:"btns"},
        h("button",{class:"btn p",onclick:()=>{e.cuts.push({id:uid(),shot:"바스트샷",face:"",scene:"",bubbles:[""],note:"",tags:""});save();draw();}},"＋ 컷"),
        h("button",{class:"btn",onclick:()=>copy(contiText(e),"콘티 복사")},"📋 콘티 복사"),
        h("button",{class:"btn",onclick:()=>copy(e.cuts.map((c,i)=>`#${i+1}\n${cutPrompt(c)}`).join("\n\n"),"전체 컷 프롬프트 복사")},"🎨 컷별 프롬프트 전부"),
        h("button",{class:"btn v",onclick:()=>aiConti(w,e,draw)},"🪄 AI 콘티 짜기"),
        h("button",{class:"btn",onclick:()=>aiContiReview(w,e,contiText(e))},"🤖 AI 검토"))));
    e.cuts.forEach((c,i)=>{
      const bub = h("div");
      const drawB = () => {
        bub.innerHTML = "";
        c.bubbles.forEach((b,j)=>bub.append(h("div",{class:"ix",style:"margin-top:6px"},
          h("span",{class:"n"},"💬"),
          h("input",{type:"text",value:b,placeholder:"대사 / 나레이션",oninput:ev=>{c.bubbles[j]=ev.target.value;save();}}),
          h("button",{class:"btn sm",onclick:()=>{c.bubbles.splice(j,1);save();drawB();}},"✕"))));
        if (c.bubbles.length < 3) bub.append(h("button",{class:"btn sm",style:"margin-top:6px",onclick:()=>{c.bubbles.push("");save();drawB();}},"＋ 말풍선"));
        else bub.append(h("div",{class:"tiny",style:"margin-top:6px"},"말풍선 3개 (최대)"));
      };
      drawB();
      const face = h("input",{type:"text",value:c.face,placeholder:"표정",list:"faces",style:"flex:1",oninput:ev=>{c.face=ev.target.value;save();}});
      list.append(h("div",{class:"card"},
        h("div",{class:"ix"}, h("b",{style:"font-size:17px;min-width:34px"},"#"+(i+1)),
          h("select",{style:"flex:1",onchange:ev=>{c.shot=ev.target.value;save();}}, SHOTS.map(s=>h("option",{selected:c.shot===s||null},s))), face),
        h("textarea",{value:c.scene,placeholder:"장면 묘사 (누가, 어디서, 뭘 하는지)",style:"min-height:64px;margin-top:8px",oninput:ev=>{c.scene=ev.target.value;save();}}),
        bub,
        h("input",{type:"text",value:c.tags||"",placeholder:"이 컷만의 영어 태그 (선택)",style:"margin-top:8px",oninput:ev=>{c.tags=ev.target.value;save();}}),
        h("input",{type:"text",value:c.note,placeholder:"메모 (연출, 주의점)",style:"margin-top:6px",oninput:ev=>{c.note=ev.target.value;save();}}),
        h("div",{class:"btns"},
          h("button",{class:"btn sm",onclick:()=>copy(cutPrompt(c),"#"+(i+1)+" 프롬프트 복사")},"🎨 프롬프트"),
          i>0?h("button",{class:"btn sm",onclick:()=>{e.cuts.splice(i,1);e.cuts.splice(i-1,0,c);save();draw();}},"⬆"):null,
          i<e.cuts.length-1?h("button",{class:"btn sm",onclick:()=>{e.cuts.splice(i,1);e.cuts.splice(i+1,0,c);save();draw();}},"⬇"):null,
          h("button",{class:"btn sm",onclick:()=>{const d=JSON.parse(JSON.stringify(c));d.id=uid();e.cuts.splice(i+1,0,d);save();draw();}},"복제"),
          h("button",{class:"btn sm d",onclick:()=>{e.cuts.splice(i,1);save();draw();}},"삭제"))));
    });
    if (!e.cuts.length) list.append(h("p",{class:"muted",style:"text-align:center;padding:16px"},"＋ 컷 을 눌러 시작하세요."));
  }
  body.append(h("datalist",{id:"faces"}, Object.keys(TAGS["표정"]).map(k=>h("option",{value:k}))), tabs, list,
    h("div",{class:"btns"}, h("button",{class:"btn",onclick:()=>go("sedotoon")},"🖼 세로툰에서 조립하기 →")));
  drawTabs(); draw();
};

  "첫 대사": ["\"…이 목소리, 내 거야?\"","\"전산 오류라니, 그게 무슨 말이오!\"","\"부단장, 날 그런 눈으로 보지 마라.\"","\"반품은… 안 되는 건가요?\"","\"성녀님? 누가? 내가?\"","\"오늘부터 네가 내 보호자다.\""],

VIEWS.idea = (body) => {
  const P = S.ideaLock = S.ideaLock || {};
  const cur = S.ideaCur = S.ideaCur || {};
  const box = h("div");
  const roll = (only) => { for (const k in IDEA) if ((!only || only===k) && !P[k]) cur[k] = IDEA[k][Math.floor(Math.random()*IDEA[k].length)]; save(); draw(); };
  const text = () => Object.keys(IDEA).map(k=>`${k}: ${cur[k]||"-"}`).join("\n");
  function draw(){
    box.innerHTML = "";
    Object.keys(IDEA).forEach(k=>box.append(h("div",{class:"item",style:"display:flex;align-items:center;gap:8px"},
      h("div",{style:"flex:1"}, h("div",{class:"tiny"},k), h("div",{style:"font-weight:600"},cur[k]||"—")),
      h("button",{class:"btn sm",onclick:()=>roll(k)},"🎲"),
      h("button",{class:"btn sm"+(P[k]?" p":""),onclick:()=>{P[k]=!P[k];save();draw();}},P[k]?"🔒":"🔓"))));
  }
  body.append(h("div",{class:"card"}, h("div",{class:"muted"},"🔒 잠근 칸은 그대로 두고 나머지만 다시 뽑아요."), box,
    h("div",{class:"btns"},
      h("button",{class:"btn p",onclick:()=>roll()},"🎲 전부 뽑기"),
      h("button",{class:"btn",onclick:()=>copy(text())},"📋 복사"),
      h("button",{class:"btn v",onclick:()=>aiIdea(text())},"🤖 AI 기획"),
      h("button",{class:"btn",onclick:()=>askText("새 작품 이름", (cur["주인공"]||"새 작품"), n=>{const w=blankWork(n,{fields:{intro:`${cur["주인공"]||""} — ${cur["사건"]||""} (${cur["장르"]||""} / ${cur["분위기"]||""})`,first:cur["첫 대사"]||""}});S.works[w.id]=w;S.order.unshift(w.id);S.cur=w.id;save();toast("새 작품으로 만들었어요");})},"➕ 이걸로 새 작품"))));
  if (!Object.keys(cur).length) roll(); else draw();
};

/* ---------- Tipsy 이전 ---------- */
const TIPSY_STEPS = ["캐릭터 이름","한 줄 소개","프로필/대표 이미지","캐릭터 설정(프롬프트)","시작 메시지","예시 대화","키워드북","상태창 규칙","태그·장르","공개 설정","테스트 대화 해보기","제타 쪽 정리(비공개 등)"];
VIEWS.tipsy = (body) => {
  const w = W(); w.tipsy = w.tipsy || {};
  const done = () => TIPSY_STEPS.filter(s=>w.tipsy[s]).length;
  const pr = h("div",{class:"prog"},h("i")); const cnt = h("span",{class:"big"});
  const upd = () => { cnt.textContent = `${done()} / ${TIPSY_STEPS.length}`; pr.firstChild.style.width = done()/TIPSY_STEPS.length*100+"%"; };
  const bundle = () => {
    const parts = [plotAll(w)];
    if (w.lore.length) parts.push("【키워드북】\n"+w.lore.filter(x=>x.on).map(x=>`[${x.k}]\n${x.v}`).join("\n\n"));
    if (w.status.items.length) parts.push("【상태창 규칙】\n매 응답 마지막에 아래 상태창을 출력한다.\n"+statusText(w.status));
    return parts.filter(Boolean).join("\n\n");
  };
  body.append(
    h("div",{class:"card"}, h("div",{class:"tiny"},"이전 진행도"), cnt, pr,
      w.tipsyNote ? h("div",{class:"warnbox"},"📌 "+w.tipsyNote) : null,
      h("div",{class:"btns"}, h("button",{class:"btn sm",onclick:()=>askText("이 작품 이전 메모 (비우면 삭제)",w.tipsyNote||"",v=>{w.tipsyNote=v;save();renderApp("tipsy");},true)},"📌 메모 달기"))),
    h("div",{class:"card"}, TIPSY_STEPS.map(s => h("label",{class:"check"},
      h("input",{type:"checkbox",checked:!!w.tipsy[s],onchange:e=>{w.tipsy[s]=e.target.checked;save();upd();}}), s))),
    h("div",{class:"card"}, h("h3",null,"📦 한 번에 옮길 텍스트"),
      h("div",{class:"muted"},"플롯 + 키워드북 + 상태창을 한 덩어리로 복사해요. Tipsy 입력칸에 항목별로 나눠 붙이면 돼요."),
      h("div",{class:"btns"},
        h("button",{class:"btn p",onclick:()=>copy(bundle(),"전체 복사")},"📋 전체 복사"),
        h("button",{class:"btn",onclick:()=>openSheet("항목별 복사", PLOT_FIELDS.filter(f=>(w.fields[f.k]||"").trim()).map(f=>h("button",{class:"btn",style:"width:100%;margin-bottom:6px;text-align:left",onclick:()=>copy(w.fields[f.k].trim(),f.t+" 복사")},"📋 "+f.t+" ("+len(w.fields[f.k])+"자)")).concat(w.lore.length?[h("button",{class:"btn",style:"width:100%;margin-bottom:6px;text-align:left",onclick:()=>copy(w.lore.map(x=>`[${x.k}]\n${x.v}`).join("\n\n"),"키워드북 복사")},"📋 키워드북")]:[]))},"항목별 복사"))),
    h("div",{class:"card"}, h("h3",null,"모든 작품 현황"),
      S.order.map(id=>{const x=S.works[id]; const n=TIPSY_STEPS.filter(s=>(x.tipsy||{})[s]).length; return h("div",{style:"margin-top:8px"}, h("div",{class:"row"},h("span",{class:"grow"},x.name),h("span",{class:"tiny"},n+"/"+TIPSY_STEPS.length)), h("div",{class:"prog"},h("i",{style:`width:${n/TIPSY_STEPS.length*100}%`})));}))
  );
  upd();
};

VIEWS.backup = (body) => {
  const ta = h("textarea",{style:"min-height:160px",placeholder:"백업 코드를 붙여 넣으세요"});
  body.append(
    h("div",{class:"card"}, h("h3",null,"💾 내보내기"),
      h("div",{class:"muted"},"작업은 이 기기의 브라우저에만 저장돼요. 브라우저 기록을 지우면 사라지니, 가끔 백업 코드를 복사해서 메모장 같은 곳에 보관하세요."),
      h("div",{class:"btns"},
        h("button",{class:"btn p",onclick:()=>{ const d=new Date(); saveFile(`zeta-studio-backup_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}.json`, JSON.stringify(S,null,1), "파일 저장이 안 되는 화면이에요. 백업 코드 복사를 써 주세요"); }},"📄 파일로 저장"),
        h("button",{class:"btn",onclick:()=>copy(JSON.stringify(S),"백업 코드 복사 ("+Math.round(JSON.stringify(S).length/1024)+"KB)")},"📋 백업 코드 복사"))),
    h("div",{class:"card"}, h("h3",null,"📥 불러오기"),
      h("label",{class:"btn",style:"position:relative;overflow:hidden;display:inline-block;margin-bottom:8px"},"📂 백업 파일 열기",
        h("input",{type:"file",accept:".json,application/json,text/plain",style:"position:absolute;inset:0;opacity:0",onchange:async e=>{ const f=e.target.files[0]; if(!f) return; ta.value=await f.text(); toast("파일을 읽었어요. 아래 버튼으로 적용하세요"); }})),
      ta,
      h("div",{class:"btns"},
        h("button",{class:"btn v",onclick:()=>{ let d; try { d = JSON.parse(ta.value); } catch(e){ return toast("코드가 올바르지 않아요"); } if(!d||!d.works) return toast("코드가 올바르지 않아요");
          confirmSheet("지금 데이터를 백업으로 덮어쓸까요?","덮어쓰기",()=>{S=d;normalizeState();saveNow();toast("불러왔어요 · 작품 "+S.order.length+"개");renderApp("backup");}); }},"전체 덮어쓰기"),
        h("button",{class:"btn",onclick:()=>{ let d; try { d = JSON.parse(ta.value); } catch(e){ return toast("코드가 올바르지 않아요"); } if(!d||!d.works) return toast("코드가 올바르지 않아요");
          let n=0; const ids = Array.isArray(d.order) ? d.order : Object.keys(d.works); for(const id of ids){ const w=normWork(d.works[id]); if(!w) continue; w.id=uid(); S.works[w.id]=w; S.order.push(w.id); n++; }
          if (Array.isArray(d.refs)) { S.refs = S.refs || []; d.refs.forEach(r => { const x = normWork(r, true); if (x){ x.id = uid(); S.refs.push(x); } }); }
          saveNow(); toast("작품 "+n+"개 추가"); renderApp("backup"); }},"작품만 추가"))),
    h("div",{class:"card"}, h("h3",null,"⚠️ 초기화"),
      h("button",{class:"btn d",onclick:()=>confirmSheet("모든 작품과 설정을 지우고 처음 상태로 돌릴까요? (AI 키는 그대로)","초기화",()=>{S=seed();normalizeState();saveNow();toast("초기화했어요");renderApp("backup");})},"전부 초기화")),
    h("p",{class:"tiny",style:"text-align:center"},"제타 스튜디오 · 내 작품 "+S.order.length+"개 · 참고 작품 "+((S.refs||[]).length)+"개")
  );
};
