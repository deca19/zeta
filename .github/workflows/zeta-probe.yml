name: zeta-probe
on:
  push:
    paths: [ "tools/zeta-probe.mjs" ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tools/zeta-probe.mjs
      - run: |
          git config user.name "zeta-bot"
          git config user.email "zeta-bot@users.noreply.github.com"
          git add data/_probe
          git commit -m "탐사봇: 페이지 구조 샘플" || echo "nothing"
          git push
