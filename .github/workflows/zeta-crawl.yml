name: 🛰 제타 탐사
# 정헌 승인: 매일 자동 + 원할 때 실행. 끄려면 이 파일을 지우거나 Actions에서 Disable workflow.
on:
  schedule:
    - cron: "41 22 * * *"     # 매일 아침 7시 41분 (한국 시간)
  workflow_dispatch:
    inputs:
      max:
        description: "읽을 작품 수 (5~60)"
        default: "36"
  push:
    paths: [ "tools/zeta-crawl.mjs" ]   # 탐사봇 코드가 바뀌면 한 번 실행해서 확인
permissions:
  contents: write
concurrency:
  group: zeta-crawl
  cancel-in-progress: false
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: 제타 탐사 (실시간 중계)
        run: node tools/zeta-crawl.mjs
        env:
          MAX: ${{ github.event.inputs.max || '36' }}
      - name: 결과 저장
        run: |
          git config user.name "zeta-bot"
          git config user.email "zeta-bot@users.noreply.github.com"
          cp data/zeta-trends.json /tmp/zeta-trends.json
          for n in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            mkdir -p data && cp /tmp/zeta-trends.json data/zeta-trends.json
            git add data/zeta-trends.json
            git commit -q -m "🛰 제타 탐사 결과 $(date -u +%Y-%m-%dT%H:%MZ)" || { echo "변화 없음"; break; }
            git push -q && break
            sleep 5
          done
